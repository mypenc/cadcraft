name: Build and deploy WASM to GitHub Pages

on:
  push:
    branches: [main, android-port]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with wasm target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build cadcraft-web (release)
        working-directory: apps/cadcraft-web
        run: trunk build --release 2>&1 | tee /tmp/build.log

      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/push-log.sh web /tmp/build.log

      - name: Add .nojekyll
        run: touch dist/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
